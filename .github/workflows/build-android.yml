name: Build Android APK

on:
  push:
    branches: [ main, master, ios ]
  pull_request:
    branches: [ main, master, ios ]
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build NexaFit Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build www folder
        run: |
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp script.js www/
          cp -r assets www/
          cp -r js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexafit-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Android App Bundle (release)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload AAB Artifact (for Play Store)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: nexafit-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30